<!DOCTYPE html>

<html>

<head>

<title>Edulytics</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

<div class="logo">

Edulytics

</div>

<ul>

<li>Dashboard</li>

<li>Students</li>

<li>Analytics</li>

</ul>

</nav>

<div class="container">

<h2>

Student Details

</h2>

<select id="studentSelect">

<option value="">

Select Student

</option>

{% for student in students %}

<option value="{{loop.index0}}">

{{student.Name}}

</option>

{% endfor %}

</select>

<div class="student-card"

id="studentCard">

Choose a student

</div>

<h2>

Analytics Section

</h2>

<select id="graphSelect">

<option value="">

Choose Graph

</option>

<option value="avg">

Average Scores

</option>

<option value="attendance">

Attendance

</option>

<option value="total">

Total Marks

</option>

<option value="performance">

Performance

</option>

<option value="relation">

Attendance vs Marks

</option>

</select>

<div class="graph-box">

<img id="graphImage"

style="display:none;">

</div>

</div>

<script>

const students =
{{students | tojson}};

const studentCard =
document.getElementById(
"studentCard"
);

document.getElementById(
"studentSelect"
).addEventListener(

"change",

function(){

let s =
students[this.value];

studentCard.innerHTML =

`

<h3>${s.Name}</h3>

<p>Math: ${s.Math}</p>

<p>Physics: ${s.Physics}</p>

<p>Chemistry: ${s.Chemistry}</p>

<p>Attendance: ${s.Attendance}</p>

<p>Total: ${s.Total}</p>

`;

}

);

const graphImage =
document.getElementById(
"graphImage"
);

document.getElementById(
"graphSelect"
).addEventListener(

"change",

function(){

const graphs = {

avg:
"{{url_for('static', filename='average_scores.png')}}",

attendance:
"{{url_for('static', filename='student_attendance.png')}}",

total:
"{{url_for('static', filename='total_marks.png')}}",

performance:
"{{url_for('static', filename='s_W_performance.png')}}",

relation:
"{{url_for('static', filename='a_vs_tm.png')}}"

};

graphImage.src =
graphs[this.value];

graphImage.style.display =
"block";

}

);

</script>

</body>

</html>
